apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-app
  namespace: llm
  labels:
    app: restaurant-app
spec:
  replicas: 1  # Reduced for local testing
  selector:
    matchLabels:
      app: restaurant-app
  template:
    metadata:
      labels:
        app: restaurant-app
    spec:
      containers:
      - name: restaurant-app
        image: restaurant-app:latest
        imagePullPolicy: Never  # Use local image built with minikube docker-env
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: OLLAMA_HOST
          value: "http://ollama:11434"
        - name: PORT
          value: "3001"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"  # Reduced for local testing
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-app
  namespace: llm
  labels:
    app: restaurant-app
spec:
  type: NodePort  # Changed to NodePort for easier minikube access
  ports:
  - port: 3001
    targetPort: 3001
    nodePort: 30001  # Fixed port for easy access
    protocol: TCP
    name: http
  selector:
    app: restaurant-app
