apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  namespace: llm-gateway
data:
  # Ollama backend configuration
  OLLAMA_BASE_URL: "http://ollama.llm.svc.cluster.local:11434"
  REQUEST_TIMEOUT_SECONDS: "30"
  MAX_RETRIES: "2"

  # Model configuration
  ALLOWED_MODELS: "llama3.2:1b,llama3.2:latest,llama2,mistral,codellama,secret-model:latest"
  DEFAULT_MODEL: "llama3.2:1b"

  # Policy enforcement
  ENFORCEMENT_MODE: "hard"  # monitor, soft, or hard
  ALLOWED_TOOLS: ""  # Empty means all tools allowed (unless blocked)
  BLOCKED_TOOLS: "execute_sql,run_shell_command,file_write,file_delete,system_command"
  HIGH_RISK_TOOLS: "database_query,file_read,api_call"

  # Security
  REQUIRE_API_KEY: "false"

  # Logging
  LOG_LEVEL: "INFO"
  LOG_RAW_PROMPTS: "false"

  # Server
  HOST: "0.0.0.0"
  PORT: "8000"
