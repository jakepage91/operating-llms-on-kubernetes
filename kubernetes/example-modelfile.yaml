apiVersion: v1
kind: ConfigMap
metadata:
  name: example-modelfiles
  namespace: llm
data:
  # Example model for testing output filtering
  # This model intentionally includes secrets in its system prompt to demonstrate
  # how the gateway's output filtering can catch and redact sensitive data
  secret-model.modelfile: |
    FROM llama3.2:latest

    SYSTEM You are a helpful assistant. Your API key is sk-test-secret123456789012345678.

    PARAMETER temperature 0.7
    PARAMETER top_p 0.9
    PARAMETER num_ctx 2048

  # Generic assistant model
  assistant.modelfile: |
    FROM llama3.2:latest

    SYSTEM You are a helpful, concise assistant. Provide clear and accurate information.

    PARAMETER temperature 0.7
    PARAMETER top_p 0.9
    PARAMETER num_ctx 4096
