apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-app-frontend
  namespace: llm
  labels:
    app: restaurant-app-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurant-app-frontend
  template:
    metadata:
      labels:
        app: restaurant-app-frontend
    spec:
      containers:
      - name: restaurant-app-frontend
        image: restaurant-app-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-app-frontend
  namespace: llm
  labels:
    app: restaurant-app-frontend
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
    name: http
  selector:
    app: restaurant-app-frontend
